#version: '3.8'

services:
  keycloak_db:
    container_name: keycloak_db
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    profiles:
      - auth
      - report

  keycloak:
    container_name: keycloak
    #image: quay.io/keycloak/keycloak:21.1
    image: playaru/keycloak-russian:21.1.1
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    profiles:
      - auth
      - report


  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000
#      REACT_APP_API_URL: http://localhost:8001
#      REACT_APP_KEYCLOAK_URL: http://localhost:8080
#      REACT_APP_KEYCLOAK_REALM: reports-realm
#      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    profiles:
      - auth
      - report

  bionicpro-auth:
    container_name: bionicpro-auth
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      BPAPI_KEYCLOAK_INTERNAL_URI: http://keycloak:8080
      BPAPI_KEYCLOAK_EXTERNAL_URI: http://localhost:8080
      BPAPI_KEYCLOAK_REALM: reports-realm
#      BPAPI_KEYCLOAK_CLIENT_ID: reports-api
#      BPAPI_KEYCLOAK_CLIENT_SECRET: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
      BPAPI_KEYCLOAK_CLIENT_ID: bionicpro-auth
      BPAPI_KEYCLOAK_CLIENT_SECRET: 27b699e3827ac84164ae43290e76f045
      REPORTS_API_INTERNAL_URL: http://bionicpro-api:8001
    profiles:
      - auth
      - report


  bionicpro-api:
    container_name: bionicpro-api
    build:
      context: ./bionicpro-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse-bio-analytics:8123/bio_analytics
      SPRING_DATASOURCE_USERNAME: clickuser
      SPRING_DATASOURCE_PASSWORD: clickpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.clickhouse.jdbc.ClickHouseDriver
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      S3_URI: http://minio-s3:9000
      S3_USER: minioadmin
      S3_PASSWORD: minioadminpassword
      CDN_BASE_URL: http://localhost:8888

    profiles:
      - auth
      - report


  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "BionicPro"
      LDAP_DOMAIN: "bionic.com"
      LDAP_BASE_DN: "dc=bionic,dc=com"

      # (cn=admin,dc=bionic,dc=com)
      LDAP_ADMIN_PASSWORD: "1234"
#      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"

      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/import/config.ldif:ro
#      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
    profiles:
      - auth

  postgres_bio_sensor:
    image: postgres:15-alpine
    container_name: postgres_bio_sensor
    environment:
      POSTGRES_USER: biouser
      POSTGRES_PASSWORD: biopassword
      POSTGRES_DB: sensor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ETL/source/postgres_bio_sensor/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./ETL/source/postgres_bio_sensor/data.csv:/tmp/data.csv
    profiles:
      - etl


  clickhouse-bio-analytics:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse-bio-analytics
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: clickuser
      CLICKHOUSE_PASSWORD: clickpassword
      CLICKHOUSE_DB: bio_analytics
    volumes:
      - chdata:/var/lib/clickhouse
      - ./ETL/destination/clickhouse_bio_analytics/ch_init.sql:/docker-entrypoint-initdb.d/ch_init.sql
    profiles:
      - etl
      - auth
      - report

  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_init
    command: >
      bash -c "pip install apache-airflow-providers-postgres clickhouse-connect && airflow db init && airflow users create --username admin --firstname Adm --lastname Adminov --role Admin --email admin@example.com --password admin"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_home:/opt/airflow
    profiles:
      - etl

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "9080:8080"
    command: bash -c "pip install apache-airflow-providers-postgres clickhouse-connect && airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - airflow_home:/opt/airflow
      - ./ETL/DAG:/opt/airflow/dags
    profiles:
      - etl

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    command: bash -c "pip install apache-airflow-providers-postgres clickhouse-connect && airflow scheduler"
    volumes:
      - airflow_home:/opt/airflow
      - ./ETL/DAG:/opt/airflow/dags
    profiles:
      - etl


  minio:
    image: minio/minio:latest
    container_name: minio-s3
    ports:
      - "9009:9000"       # S3 API Endpoint
      - "9001:9001"       # Web-консоль управления
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    profiles:
      - report

  nginx-cdn:
    image: nginx:latest
    container_name: nginx-cdn
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - minio
    profiles:
      - report

volumes:
  pgdata:
  chdata:
  airflow_home:
  minio_data:
  nginx_cache:
