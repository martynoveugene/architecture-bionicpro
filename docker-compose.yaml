#version: '3.8'

services:
  keycloak_db:
    container_name: keycloak_db
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    container_name: keycloak
    #image: quay.io/keycloak/keycloak:21.1
    image: playaru/keycloak-russian:21.1.1
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db


  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000
#      REACT_APP_API_URL: http://localhost:8001
#      REACT_APP_KEYCLOAK_URL: http://localhost:8080
#      REACT_APP_KEYCLOAK_REALM: reports-realm
#      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  bionicpro-auth:
    container_name: bionicpro-auth
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      BPAPI_KEYCLOAK_INTERNAL_URI: http://keycloak:8080
      BPAPI_KEYCLOAK_EXTERNAL_URI: http://localhost:8080
      BPAPI_KEYCLOAK_REALM: reports-realm
#      BPAPI_KEYCLOAK_CLIENT_ID: reports-api
#      BPAPI_KEYCLOAK_CLIENT_SECRET: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
      BPAPI_KEYCLOAK_CLIENT_ID: bionicpro-auth
      BPAPI_KEYCLOAK_CLIENT_SECRET: 27b699e3827ac84164ae43290e76f045
      REPORTS_API_INTERNAL_URL: http://bionicpro-api:8001


  bionicpro-api:
    container_name: bionicpro-api
    build:
      context: ./bionicpro-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse-bio-analytics:8123/bio_analytics
      SPRING_DATASOURCE_USERNAME: clickuser
      SPRING_DATASOURCE_PASSWORD: clickpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.clickhouse.jdbc.ClickHouseDriver
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      S3_URI: http://minio-s3:9000
      S3_USER: minioadmin
      S3_PASSWORD: minioadminpassword
      CDN_BASE_URL: http://localhost:8888



  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "BionicPro"
      LDAP_DOMAIN: "bionic.com"
      LDAP_BASE_DN: "dc=bionic,dc=com"

      # (cn=admin,dc=bionic,dc=com)
      LDAP_ADMIN_PASSWORD: "1234"
#      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"

      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/import/config.ldif:ro
#      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"

  postgres_bio_sensor:
    image: postgres:15-alpine
    container_name: postgres_bio_sensor
    environment:
      POSTGRES_USER: biouser
      POSTGRES_PASSWORD: biopassword
      POSTGRES_DB: sensor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ETL/source/postgres_bio_sensor/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./ETL/source/postgres_bio_sensor/data.csv:/tmp/data.csv


  clickhouse-bio-analytics:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: clickhouse-bio-analytics
    ports:
      - "8123:8123"
#      - "9000:9000"
    environment:
      CLICKHOUSE_USER: clickuser
      CLICKHOUSE_PASSWORD: clickpassword
      CLICKHOUSE_DB: bio_analytics
    volumes:
      - chdata:/var/lib/clickhouse
      - ./ETL/destination/clickhouse_bio_analytics/00-ch_init.sql:/docker-entrypoint-initdb.d/00-ch_init.sql
      - ./CDC/clickhouse/01-init-destination.sql:/docker-entrypoint-initdb.d/01-init-destination.sql
      - ./CDC/clickhouse/02-init-raw.sql:/docker-entrypoint-initdb.d/02-init-raw.sql
      - ./CDC/clickhouse/03-init-report.sql:/docker-entrypoint-initdb.d/03-init-report.sql
      - ./CDC/clickhouse/04-init-view.sql:/docker-entrypoint-initdb.d/04-init-view.sql

  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_init
    command: >
      bash -c "pip install apache-airflow-providers-postgres clickhouse-connect && airflow db init && airflow users create --username admin --firstname Adm --lastname Adminov --role Admin --email admin@example.com --password admin"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_home:/opt/airflow

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "9080:8080"
    command: bash -c "pip install apache-airflow-providers-postgres clickhouse-connect && airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - airflow_home:/opt/airflow
      - ./ETL/DAG:/opt/airflow/dags

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow_scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    command: bash -c "pip install apache-airflow-providers-postgres clickhouse-connect && airflow scheduler"
    volumes:
      - airflow_home:/opt/airflow
      - ./ETL/DAG:/opt/airflow/dags


  minio:
    image: minio/minio:latest
    container_name: minio-s3
    ports:
      - "9009:9000"       # S3 API Endpoint
      - "9001:9001"       # Web-консоль управления
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  nginx-cdn:
    image: nginx:latest
    container_name: nginx-cdn
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - minio


  postgres-crm:
    image: postgres:15-alpine
    container_name: postgres-crm
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: bionic_user
      POSTGRES_PASSWORD: bionic_password
    ports:
      - "5434:5432"
    volumes:
      - ./CDC/source:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "wal_level=logical"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFERS_INVOLVED_PARTITION_ASSIGNMENT: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  debezium:
    image: debezium/connect:2.4
    container_name: debezium-cdc
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres-crm
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      LOG_LEVEL: DEBUG


volumes:
  pgdata:
  chdata:
  airflow_home:
  minio_data:
  nginx_cache:
